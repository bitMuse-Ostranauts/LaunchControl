[config]
schemaVersion = "0.0.1"

[package]
namespace = "bitMods"
name = "LaunchControl"
versionNumber = "1.0.3"
description = "LaunchControl is a C# modding toolkit for Ostranauts, providing shared systems, commands, and utilities to accelerate building advanced mods."
websiteUrl = "https://github.com/bitMuse-Ostranauts/LaunchControl"
containsNsfwContent = false

[package.dependencies]
BepInEx-BepInExPack_Ostranauts = "5.4.2303"

[build]
icon = "./icon.png"
readme = "./README.md"
outdir = "./dist/thunderstore"

[[build.copy]]
source = "./artifact"
target = ""

[publish]
repository = "https://thunderstore.io"
communities = ["ostranauts"]

[publish.categories]
ostranauts = ["libraries"]

