name: Build and Release LaunchControl

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (e.g., 1.0.0)'
        required: true
        default: ''
      reference_assemblies:
        description: 'Reference assemblies filename from http://files.bitmuse.me/ (e.g., assemblies-v1.2.3.tar.gz.enc)'
        required: true
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Get latest tag
        id: get_tag
        run: |
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "1.0.0")
          echo "latest_tag=$LATEST_TAG" >> $GITHUB_OUTPUT
      
      - name: Parse manifest for game version
        id: parse_manifest
        run: |
          GAME_VERSION=$(jq -r '.game_version_number' manifest.json)
          echo "game_version=$GAME_VERSION" >> $GITHUB_OUTPUT
          echo "default_assemblies=assemblies-v${GAME_VERSION}.tar.gz.enc" >> $GITHUB_OUTPUT
      
      - name: Set version and assemblies
        id: set_vars
        run: |
          if [ -z "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ steps.get_tag.outputs.latest_tag }}"
          else
            VERSION="${{ github.event.inputs.version }}"
          fi
          
          if [ -z "${{ github.event.inputs.reference_assemblies }}" ]; then
            ASSEMBLIES="${{ steps.parse_manifest.outputs.default_assemblies }}"
          else
            ASSEMBLIES="${{ github.event.inputs.reference_assemblies }}"
          fi
          
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "assemblies=$ASSEMBLIES" >> $GITHUB_OUTPUT
          echo "Building version: $VERSION"
          echo "Using assemblies: $ASSEMBLIES"
      
      - name: Download BepInEx from Thunderstore
        run: |
          # Download BepInEx 5.4.23.3 for Ostranauts
          curl -L -o bepinex.zip \
            "https://thunderstore.io/package/download/BepInEx/BepInExPack_Ostranauts/5.4.2303/"
          
          # Extract BepInEx
          unzip -q bepinex.zip -d bepinex_temp
          
          # Create BepInEx directory structure
          mkdir -p vendor/refs/BepInEx/core
          
          # Copy BepInEx assemblies to the correct location
          cp bepinex_temp/BepInExPack/BepInEx/core/*.dll vendor/refs/BepInEx/core/
          
          echo "BepInEx assemblies installed:"
          ls -la vendor/refs/BepInEx/core/
      
      - name: Download reference assemblies
        run: |
          curl -o reference-assemblies.tar.gz.enc \
            "http://files.bitmuse.me/${{ steps.set_vars.outputs.assemblies }}"
      
      - name: Decrypt archive
        env:
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
        run: |
          openssl enc -d -aes-256-cbc -pbkdf2 \
            -in reference-assemblies.tar.gz.enc \
            -out reference-assemblies.tar.gz \
            -pass env:ENCRYPTION_KEY
      
      - name: Extract game assemblies
        run: |
          mkdir -p vendor/refs/extracted
          tar -xzf reference-assemblies.tar.gz -C vendor/refs/extracted
          echo "Extracted game assemblies:"
          find vendor/refs/extracted -type f -name "*.dll" | head -20
      
      - name: Update manifest.json version
        run: |
          jq '.version_number = "${{ steps.set_vars.outputs.version }}"' manifest.json > manifest.json.tmp
          mv manifest.json.tmp manifest.json
          cat manifest.json
      
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      
      - name: Organize game assemblies
        run: |
          # Find where the game DLLs were extracted
          MANAGED_DIR=$(find vendor/refs/extracted -name "Assembly-CSharp.dll" -exec dirname {} \; | head -1)
          
          if [ -z "$MANAGED_DIR" ]; then
            echo "ERROR: Could not find Assembly-CSharp.dll in extracted files"
            echo "Searching for DLL files in extracted archive:"
            find vendor/refs/extracted -name "*.dll" | head -20
            exit 1
          fi
          
          echo "Found game assemblies in: $MANAGED_DIR"
          
          # Create proper directory structure for game assemblies
          mkdir -p vendor/refs/Ostranauts_Data/Managed
          
          # Copy all game and Unity assemblies
          cp "$MANAGED_DIR"/*.dll vendor/refs/Ostranauts_Data/Managed/
          
          echo "Game assemblies installed:"
          ls -la vendor/refs/Ostranauts_Data/Managed/ | head -20
          
          echo ""
          echo "Complete reference structure:"
          echo "BepInEx:"
          ls -la vendor/refs/BepInEx/core/
          echo ""
          echo "Game/Unity (first 10):"
          ls vendor/refs/Ostranauts_Data/Managed/ | head -10
      
      - name: Build project
        run: |
          # Build with reference assemblies from vendor/refs
          dotnet build LaunchControl.csproj \
            -c Release \
            -p:OstranautsPath="${GITHUB_WORKSPACE}/vendor/refs" \
            -p:OutputPath="${GITHUB_WORKSPACE}/build/output/" \
            -p:GenerateTargetFrameworkAttribute=false
      
      - name: Create artifact structure
        run: |
          mkdir -p artifact/plugins/LaunchControl
          cp build/output/LaunchControl.dll artifact/plugins/LaunchControl/
          cp manifest.json artifact/plugins/LaunchControl/
          echo "Artifact contents:"
          ls -R artifact/
      
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: LaunchControl-${{ steps.set_vars.outputs.version }}
          path: artifact/plugins/
      
      - name: Commit version update and create tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Commit the manifest.json version update
          git add manifest.json
          git commit -m "Release v${{ steps.set_vars.outputs.version }}"
          
          # Create and push tag
          git tag -a "v${{ steps.set_vars.outputs.version }}" -m "Release v${{ steps.set_vars.outputs.version }}"
          git push origin HEAD:${{ github.ref }}
          git push origin "v${{ steps.set_vars.outputs.version }}"

